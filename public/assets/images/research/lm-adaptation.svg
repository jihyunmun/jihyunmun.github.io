<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" role="img"
     aria-label="Four ways to adapt a pretrained language model, compared by what actually gets trained. Full fine-tuning updates every layer. Prompt tuning trains only soft prompt vectors at the input. P-tuning inserts continuous prompts at every layer. LoRA trains small low-rank adapters inside each layer. In the last three the pretrained weights stay frozen.">
  <style>
    .ttl  { font: 600 13px "IBM Plex Sans", system-ui, sans-serif; fill: #15171B; }
    .sub  { font: 11.5px "IBM Plex Sans", system-ui, sans-serif; fill: #5B6066; }
    .lbl  { font: 10px "IBM Plex Mono", monospace; fill: #8A9098; letter-spacing: .06em; }
    .frozen  { fill: none; stroke: #C6C9C1; }
    .trained { fill: #2A3C8F; stroke: #2A3C8F; }
    .tint    { fill: #E3E7F6; stroke: #2A3C8F; }
    .rule    { stroke: #DBDDD6; }
  </style>

  <text class="lbl" x="28" y="26">FOUR WAYS TO ADAPT ONE PRETRAINED LANGUAGE MODEL</text>
  <text class="lbl" x="28" y="352">FILLED = TRAINED</text>
  <text class="lbl" x="200" y="352">OUTLINE = FROZEN PRETRAINED WEIGHTS</text>
  <line class="rule" x1="28" y1="326" x2="952" y2="326"/>

  <!-- ============ 1. full fine-tuning ============ -->
  <text class="ttl" x="28" y="60">Full fine-tuning</text>
  <g>
    <rect class="trained" x="28" y="76"  width="176" height="26" rx="2"/>
    <rect class="trained" x="28" y="110" width="176" height="26" rx="2"/>
    <rect class="trained" x="28" y="144" width="176" height="26" rx="2"/>
    <rect class="trained" x="28" y="178" width="176" height="26" rx="2"/>
  </g>
  <g>
    <rect class="frozen" x="28"  y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="55"  y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="82"  y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="109" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="136" y="222" width="22" height="22" rx="2"/>
  </g>
  <text class="lbl" x="166" y="238">tokens</text>
  <text class="sub" x="28" y="278">Every weight in the model</text>
  <text class="sub" x="28" y="296">is updated. One full copy</text>
  <text class="sub" x="28" y="314">of the model per task.</text>

  <!-- ============ 2. prompt tuning ============ -->
  <text class="ttl" x="268" y="60">Prompt tuning</text>
  <g>
    <rect class="frozen" x="268" y="76"  width="176" height="26" rx="2"/>
    <rect class="frozen" x="268" y="110" width="176" height="26" rx="2"/>
    <rect class="frozen" x="268" y="144" width="176" height="26" rx="2"/>
    <rect class="frozen" x="268" y="178" width="176" height="26" rx="2"/>
  </g>
  <g>
    <rect class="trained" x="268" y="222" width="22" height="22" rx="2"/>
    <rect class="trained" x="295" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="322" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="349" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="376" y="222" width="22" height="22" rx="2"/>
  </g>
  <text class="lbl" x="406" y="238">tokens</text>
  <text class="sub" x="268" y="278">A handful of soft prompt</text>
  <text class="sub" x="268" y="296">vectors are learned at the</text>
  <text class="sub" x="268" y="314">input. The model is frozen.</text>

  <!-- ============ 3. P-tuning ============ -->
  <text class="ttl" x="508" y="60">P-tuning</text>
  <g>
    <rect class="frozen" x="532" y="76"  width="152" height="26" rx="2"/>
    <rect class="frozen" x="532" y="110" width="152" height="26" rx="2"/>
    <rect class="frozen" x="532" y="144" width="152" height="26" rx="2"/>
    <rect class="frozen" x="532" y="178" width="152" height="26" rx="2"/>
    <rect class="trained" x="508" y="76"  width="16" height="26" rx="2"/>
    <rect class="trained" x="508" y="110" width="16" height="26" rx="2"/>
    <rect class="trained" x="508" y="144" width="16" height="26" rx="2"/>
    <rect class="trained" x="508" y="178" width="16" height="26" rx="2"/>
  </g>
  <g>
    <rect class="trained" x="508" y="222" width="22" height="22" rx="2"/>
    <rect class="trained" x="535" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="562" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="589" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen"  x="616" y="222" width="22" height="22" rx="2"/>
  </g>
  <text class="lbl" x="646" y="238">tokens</text>
  <text class="sub" x="508" y="278">Continuous prompts enter</text>
  <text class="sub" x="508" y="296">at every layer, not only at</text>
  <text class="sub" x="508" y="314">the input.</text>

  <!-- ============ 4. LoRA ============ -->
  <text class="ttl" x="748" y="60">Low-rank adapters</text>
  <g>
    <rect class="frozen" x="748" y="76"  width="176" height="26" rx="2"/>
    <rect class="frozen" x="748" y="110" width="176" height="26" rx="2"/>
    <rect class="frozen" x="748" y="144" width="176" height="26" rx="2"/>
    <rect class="frozen" x="748" y="178" width="176" height="26" rx="2"/>
    <rect class="tint" x="884" y="82"  width="32" height="14" rx="2"/>
    <rect class="tint" x="884" y="116" width="32" height="14" rx="2"/>
    <rect class="tint" x="884" y="150" width="32" height="14" rx="2"/>
    <rect class="tint" x="884" y="184" width="32" height="14" rx="2"/>
  </g>
  <g>
    <rect class="frozen" x="748" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="775" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="802" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="829" y="222" width="22" height="22" rx="2"/>
    <rect class="frozen" x="856" y="222" width="22" height="22" rx="2"/>
  </g>
  <text class="lbl" x="886" y="238">tokens</text>
  <text class="sub" x="748" y="278">A small low-rank matrix is</text>
  <text class="sub" x="748" y="296">trained beside each frozen</text>
  <text class="sub" x="748" y="314">layer and added to it.</text>
</svg>
